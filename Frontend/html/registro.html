<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Daily study</title>
    <link rel="stylesheet" href="/Frontend/css/registro.css">
</head>
<body class="login-page">
    <div class="login-container">
        <h1>Daily study</h1>
        <h2>Crie sua Conta</h2>
        
        <form id="registerForm">
            <input type="text" id="usernameRegistro" placeholder="Nome de Usuário" required>
            <input type="email" id="emailRegistro" placeholder="E-mail" required>
            
            <div class="password-wrapper" style="position: relative; display: flex; align-items: center; width: 100%;">
                <input type="password" id="senhaRegistro" placeholder="Senha" required style="padding-right: 40px; width: 100%;">
                
                <button type="button" id="togglePasswordRegister" style="position: absolute; right: 12px; background: none; border: none; cursor: pointer; color: #ccc; display: flex; align-items: center; padding: 0; z-index: 2;">
                    <svg id="eyeIconRegister" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
            <button type="submit" class="submit-button">Registrar</button>
            <p id="mensagemSucesso" style="color: lightgreen; margin-top: 15px; display: none;">Registro realizado com sucesso!</p>
            <p id="mensagemErroRegistro" class="error-message" style="display: none;"></p>
        </form>
        <p style="margin-top: 15px; font-size: 0.9rem; color: #ccc;">
            Já tem conta? <a href="/Frontend/html/login.html" style="color: var(--marrom-claro); text-decoration: none;">Faça Login</a>
        </p>
    </div>

    <script src="/Frontend/js/registro.js"></script>
</body>
</html>
