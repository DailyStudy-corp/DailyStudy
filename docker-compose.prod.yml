services:
  backend:
    profiles: !reset []          # remove a restrição de profile em produção — sempre sobe
    restart: unless-stopped
    environment:
      OCI_STORAGE_BUCKET: ${OCI_STORAGE_BUCKET:?defina OCI_STORAGE_BUCKET no .env}
      OCI_STORAGE_CONFIGFILE: /oci/config
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    volumes:
      - /opt/dailystudy-oci:/oci:ro
    deploy:
      resources:
        limits:
          memory: 1g  
  nginx:
    build:
      context: .
      dockerfile: nginx/DockerFile   # COPY do Frontend embutido na imagem, sem bind mount
    volumes:
      - ./nginx/prod/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot;
      sleep 12h; done"

volumes:
  certbot-etc:
  certbot-webroot: