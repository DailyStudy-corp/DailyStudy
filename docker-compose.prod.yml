services:
  backend:
    profiles: []          # remove a restrição de profile em produção — sempre sobe
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile   # COPY do Frontend embutido na imagem, sem bind mount
    volumes:
      - ./nginx/prod/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot;
      sleep 12h; done"

volumes:
  certbot-etc:
  certbot-webroot: